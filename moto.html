    h += "<div><label class='lb'>3 · Motorisation & puissance</label><select class='sel' data-mf='e'" + (ST.m ? "" : " disabled") + "><option value=''>" + (ST.m ? engs.length + " motorisation(s)" : "Choisir un modèle") + "</option>" + engs.map(function (e) { return "<option value='" + e.id + "'" + (ST.e === e.id ? " selected" : "") + ">" + esc(e.label) + " · " + e.hp + " ch · " + e.y.join("-") + "</option>"; }).join("") + "</select></div>";
    h += "<div><label class='lb'>Année du véhicule</label><select class='sel' data-mf='y'><option value='0'>Toutes</option>" + [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027].map(function (y) { return "<option value='" + y + "'" + (ST.y === y ? " selected" : "") + ">" + y + "</option>"; }).join("") + "</select></div>";
    h += "<div><label class='lb'>Sévérité</label><select class='sel' data-mf='sev'><option value=''>Toutes</option>" + Object.keys(SV).map(function (s) { return "<option value='" + s + "'" + (ST.sev === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select></div></div>";
    if (ST.tab === "parc") {
      var le = enginesFiltered();
      h += "<div class='bar'><span class='cnt'>" + fmt(le.length) + " motorisation(s)</span>" + (ST.e ? "<button class='btn pri' data-mact='detail' data-id='" + ST.e + "'>Fiche & corrélations</button>" : "") + "</div>";
      h += "<div class='grid'>" + (le.length ? le.slice(0, 120).map(engCard).join("") : "<div class='empty' style='grid-column:1/-1'>Aucune motorisation pour ces filtres.</div>") + "</div>";
    } else if (ST.tab === "faults") {
      var lf = faultsFiltered();
      h += "<div class='bar'><span class='cnt'>" + lf.length + " panne(s) détaillée(s)</span></div>";
      h += lf.length ? "<div class='g2'>" + lf.slice(0, 60).map(function (f) { return "<div>" + faultCard(f) + "</div>"; }).join("") + "</div>" : "<div class='empty'>Aucune panne pour ces filtres.</div>";
    } else {
      var lt = tsbFiltered(ST.tab === "recalls");
      h += "<div class='bar'><span class='cnt'>" + lt.length + " bulletin(s)</span></div>";
      h += lt.length ? "<div class='g2'>" + lt.slice(0, 60).map(function (t) { return "<div>" + tsbCard(t) + "</div>"; }).join("") + "</div>" : "<div class='empty'>Aucun bulletin pour ces filtres.</div>";
    }
    v.innerHTML = h;
    var a = $("#stB"), b2 = $("#stM"), c2 = $("#stE"), d2 = $("#stF"), e2 = $("#stT");
    if (a) a.textContent = cB; if (b2) b2.textContent = cM; if (c2) c2.textContent = fmt(cE); if (d2) d2.textContent = cF; if (e2) e2.textContent = cT;
  }
  function openDetail(id) {
    var e = EIDX[id]; if (!e) return;
    var m = modelOf(e), b = brandOf(e), fs = faultsFor(e), ts = tsbFor(e);
    var h = "<div class='sg'>" + [["Marque", b ? b.n : "—"], ["Région", b ? REG[b.region] : "—"], ["Modèle", m ? m.n : "—"], ["Segment", m ? m.seg : "—"], ["Phase", m ? m.phase : "—"], ["Code", e.code], ["Type", e.type === "e" ? "Électrique" : e.type === "2T" ? "2 temps" : e.type === "4T" ? "4 temps" : e.type], ["Cylindrée", e.disp ? e.disp + " cm³" : "—"], ["Puissance", e.hp + " ch / " + e.kw + " kW"], ["Couple", e.nm + " Nm"], ["Boîte", e.gb], ["Production", e.y.join("-")]].map(function (r) { return "<div class='sp'><span>" + esc(r[0]) + "</span><b class='hl'>" + esc(r[1]) + "</b></div>"; }).join("") + "</div>";
    h += "<h3 style='font:600 14px var(--gd);margin:14px 0 8px;color:#A8E63C'>Pannes connues (" + fs.length + ")</h3>" + (fs.length ? fs.map(faultCard).join("") : "<p style='color:var(--t2)'>Aucune panne corrélée.</p>");
    h += "<h3 style='font:600 14px var(--gd);margin:14px 0 8px;color:#A8E63C'>Rappels & bulletins (" + ts.length + ")</h3>" + (ts.length ? ts.map(tsbCard).join("") : "<p style='color:var(--t2)'>Aucun bulletin corrélé.</p>");
    var ti = $("#mmTitle"), bd = $("#mmBody"), md = $("#mmodal");
    if (ti) ti.textContent = (b ? b.n + " " : "") + (m ? m.n + " — " : "") + e.label;
    if (bd) bd.innerHTML = h;
    if (md) { md.classList.add("on"); D.body.classList.add("lock"); }
  }
  function closeDetail() { var md = $("#mmodal"); if (md) md.classList.remove("on"); D.body.classList.remove("lock"); }

  /* ── Fond dynamique : moto cross qui cabre (stadium supercross) ── */
  var CV = null, CX = null, RAF = 0, T = 0, LAST = 0, DIRT = [];
  function resize() { if (!CV) return; var d = Math.min(window.devicePixelRatio || 1, 1.5); CV.width = Math.max(1, innerWidth * d); CV.height = Math.max(1, innerHeight * d); CX.setTransform(d, 0, 0, d, 0, 0); }
  function drawScene(t) {
    var W = innerWidth, H = innerHeight, c = CX, i;
    var sky = c.createLinearGradient(0, 0, 0, H * 0.6);
    sky.addColorStop(0, "#04070C"); sky.addColorStop(0.7, "#0A1220"); sky.addColorStop(1, "#141005");
    c.fillStyle = sky; c.fillRect(0, 0, W, H * 0.6);
    for (i = 0; i < 6; i++) {
      var fx = ((i * 0.19 + 0.06) * W), fy = H * 0.08;
      var g = c.createRadialGradient(fx, fy, 0, fx, fy, H * 0.34);
      g.addColorStop(0, "rgba(255,244,214,.22)"); g.addColorStop(1, "rgba(255,244,214,0)");
      c.fillStyle = g; c.fillRect(0, 0, W, H * 0.6);
      c.strokeStyle = "rgba(255,244,214,.3)"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx, H * 0.26); c.stroke();
    }
    c.fillStyle = "#0B0F06"; c.fillRect(0, H * 0.34, W, H * 0.08);
    for (i = 0; i < 30; i++) {
      var bx2 = ((i * 80 - (t * 200) % 80) % (W + 80)) - 40;
      c.fillStyle = i % 2 ? "rgba(168,230,60,.14)" : "rgba(238,244,228,.08)";
      c.fillRect(bx2, H * 0.34, 40, H * 0.07);
    }
    var gy = H * 0.42;
    var gr = c.createLinearGradient(0, gy, 0, H);
    gr.addColorStop(0, "#3A2A12"); gr.addColorStop(0.4, "#2A1D0C"); gr.addColorStop(1, "#160F06");
    c.fillStyle = gr; c.fillRect(0, gy, W, H - gy);
    for (i = 0; i < 40; i++) {
      var mx = ((i * 60 - (t * 520) % 60) % (W + 60)) - 30;
      var my = gy + 20 + ((i * 37) % (H - gy - 40));
      c.fillStyle = "rgba(0,0,0,.25)";
      c.beginPath(); c.ellipse(mx, my, 16, 5, 0, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = "rgba(168,230,60,.25)"; c.lineWidth = 3;
    c.beginPath();
    for (i = 0; i <= W; i += 24) { var yy = gy + 10 + Math.sin((i + t * 520) * 0.02) * 6; if (i) c.lineTo(i, yy); else c.moveTo(i, yy); }
    c.stroke();
    var wx = W * 0.34, wy = H * 0.66;
    var ang = -0.42 + Math.sin(t * 2.2) * 0.05;
    c.save(); c.translate(wx, wy); c.rotate(ang);
    c.strokeStyle = "rgba(168,230,60,.4)"; c.lineWidth = 2;
    for (i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-140 - i * 22, 10 + i * 6); c.lineTo(-70, 6); c.stroke(); }
    function wheel(x, y, r, spin) {
      c.fillStyle = "#0A0A0A"; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "#2A2A2A"; c.lineWidth = 6; c.beginPath(); c.arc(x, y, r - 5, 0, Math.PI * 2); c.stroke();
      c.save(); c.translate(x, y); c.rotate(spin);
      c.strokeStyle = "#8A8A8A"; c.lineWidth = 2;
      for (var s2 = 0; s2 < 6; s2++) { c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(s2 * 1.047) * (r - 8), Math.sin(s2 * 1.047) * (r - 8)); c.stroke(); }
      c.restore();
      c.fillStyle = "#C9C9C9"; c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2); c.fill();
    }
    wheel(-52, 26, 26, t * 22);
    wheel(58, -34, 24, t * 16);
    c.strokeStyle = "#A8E63C"; c.lineWidth = 7;
    c.beginPath(); c.moveTo(-52, 26); c.lineTo(-14, 2); c.lineTo(24, -6); c.stroke();
    c.beginPath(); c.moveTo(24, -6); c.lineTo(58, -34); c.stroke();
    c.fillStyle = "#A8E63C";
    c.beginPath(); c.moveTo(-20, -2); c.lineTo(16, -14); c.lineTo(30, -8); c.lineTo(10, 6); c.closePath(); c.fill();
    c.fillStyle = "#141D0C"; c.beginPath(); c.moveTo(-24, -6); c.lineTo(-6, -16); c.lineTo(6, -12); c.lineTo(-10, -2); c.closePath(); c.fill();
    c.strokeStyle = "#E4FF7A"; c.lineWidth = 4;
    c.beginPath(); c.moveTo(26, -12); c.lineTo(40, -26); c.stroke();
    c.beginPath(); c.moveTo(26, -12); c.lineTo(44, -18); c.stroke();
    c.fillStyle = "#0E1509";
    c.beginPath(); c.ellipse(2, -26, 16, 9, -0.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#FFD60A"; c.beginPath(); c.arc(14, -32, 6, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#141D0C"; c.beginPath(); c.arc(16, -33, 3, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#141D0C"; c.lineWidth = 6;
    c.beginPath(); c.moveTo(4, -24); c.lineTo(20, -14); c.lineTo(34, -20); c.stroke();
    c.beginPath(); c.moveTo(2, -22); c.lineTo(10, -8); c.lineTo(2, 2); c.stroke();
    c.fillStyle = "rgba(255,214,10,.85)"; c.beginPath(); c.arc(60, -40, 3, 0, Math.PI * 2); c.fill();
    c.restore();
    if (DIRT.length < 60 && Math.random() < 0.8) DIRT.push({ x: wx - 70, y: wy + 30, vx: -3 - Math.random() * 4, vy: -1 - Math.random() * 3, r: 2 + Math.random() * 4, a: 0.7 });
    DIRT = DIRT.filter(function (p) { return p.a > 0.03; });
    DIRT.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.a *= 0.95; c.fillStyle = "rgba(90,64,28," + p.a.toFixed(3) + ")"; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill(); });
    c.fillStyle = "rgba(168,230,60,.9)"; c.font = "600 12px 'IBM Plex Mono',monospace";
    c.fillText("LAP " + (Math.floor(t / 18) + 1), 16, 26);
    c.fillText(Math.round(68 + Math.sin(t * 1.3) * 12) + " km/h · WHEELIE", 16, 44);
    c.fillStyle = "rgba(255,214,10,.8)"; c.fillText("SUPERCROSS NIGHT · MOTOS & QUADS", 16, 62);
  }
  function loop(n2) { RAF = requestAnimationFrame(loop); var dt = Math.min(0.05, (n2 - LAST) / 1000); LAST = n2; T += dt; drawScene(T); }
  function startScene() { CV = $("#mbg"); if (!CV) return; CX = CV.getContext("2d"); if (!CX) return; resize(); window.addEventListener("resize", resize); LAST = performance.now(); RAF = requestAnimationFrame(loop); D.addEventListener("visibilitychange", function () { if (D.hidden) cancelAnimationFrame(RAF); else { LAST = performance.now(); RAF = requestAnimationFrame(loop); } }); }

  /* ── Événements ── */
  D.addEventListener("click", function (ev) {
    var t = ev.target;
    var card = t.closest ? t.closest("[data-eng]") : null;
    if (card) { ST.e = card.dataset.eng; openDetail(ST.e); render(); return; }
    var tab = t.closest ? t.closest("[data-mtab]") : null;
    if (tab) { ST.tab = tab.dataset.mtab; render(); return; }
    var det = t.closest ? t.closest("[data-mact='detail']") : null;
    if (det) { openDetail(det.dataset.id); return; }
    if (t.closest && t.closest("#mmClose")) { closeDetail(); return; }
    if (t.id === "mmodal") { closeDetail(); return; }
  });
  D.addEventListener("change", function (ev) {
    var t = ev.target; if (!t || !t.dataset || !t.dataset.mf) return;
    var k = t.dataset.mf;
    if (k === "b") { ST.b = t.value; ST.m = ""; ST.e = ""; }
    else if (k === "m") { ST.m = t.value; ST.e = ""; }
    else if (k === "e") { ST.e = t.value; }
    else if (k === "y") { ST.y = num(t.value, 0); }
    else if (k === "sev") { ST.sev = t.value; }
    render();
  });
  D.addEventListener("input", function (ev) { var t = ev.target; if (t && t.id === "mq") { ST.q = t.value; render(); } });
  D.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeDetail(); });
  var bk = $("#mback");
  if (bk) bk.addEventListener("click", function (e) { if (window.parent && window.parent !== window) { e.preventDefault(); try { window.parent.postMessage({ md: "uniback" }, "*"); } catch (err) {} } });

  function boot() { startScene(); render(); }
  if (D.readyState === "loading") D.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
